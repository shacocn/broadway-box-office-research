[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "broadway-research"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "statsmodels", "openpyxl", "matplotlib", "plotly", "tabulate"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
